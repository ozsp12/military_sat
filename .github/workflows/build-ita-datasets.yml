name: Build ITA datasets

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/build_ita_datasets.py"
      - "requirements.txt"
      - "ita_provas/**/*.pdf"
      - ".github/workflows/build-ita-datasets.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/build_ita_datasets.py"
      - "requirements.txt"
      - "ita_provas/**/*.pdf"
      - ".github/workflows/build-ita-datasets.yml"

permissions:
  contents: write

concurrency:
  group: build-ita-datasets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install OCR language data
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-por
          tessdata="$(dirname "$(find /usr/share -name eng.traineddata -print -quit)")"
          test -n "$tessdata"
          test -f "$tessdata/por.traineddata"
          echo "TESSDATA_PREFIX=$tessdata" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate script syntax
        run: python -m compileall -q scripts/build_ita_datasets.py

      - name: Build ITA datasets
        run: python scripts/build_ita_datasets.py

      - name: Validate generated datasets
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          import pandas as pd

          mc = pd.read_parquet("data/ita_multiple_choice.parquet")
          essay = pd.read_parquet("data/ita_essay_questions.parquet")
          mc_images = pd.read_parquet("data/ita_multiple_choice_images.parquet")
          essay_images = pd.read_parquet("data/ita_essay_questions_images.parquet")

          mc_questions = mc["question_id"].nunique()
          if mc_questions < 1200:
              raise SystemExit(f"Too few multiple-choice questions: {mc_questions}")
          if len(essay) < 400:
              raise SystemExit(f"Too few essay questions: {len(essay)}")

          if mc["alternative_id"].duplicated().any():
              raise SystemExit("alternative_id is not unique")
          if essay["question_id"].duplicated().any():
              raise SystemExit("essay question_id is not unique")
          if not (mc.groupby("question_id")["alternative"].nunique() == 5).all():
              raise SystemExit("At least one multiple-choice question does not have five alternatives")

          legacy_years = set(range(2008, 2019))
          mc_years = set(mc["year"].unique())
          essay_years = set(essay["year"].unique())
          if not legacy_years.issubset(mc_years):
              raise SystemExit(f"Missing legacy MC years: {sorted(legacy_years - mc_years)}")
          if not legacy_years.issubset(essay_years):
              raise SystemExit(f"Missing legacy essay years: {sorted(legacy_years - essay_years)}")

          modern_years = set(range(2019, 2027))
          phase1_years = set(mc.loc[mc["exam_phase"] == "phase_1", "year"].unique())
          phase2_essay_years = set(essay.loc[essay["exam_phase"] == "phase_2", "year"].unique())
          if not modern_years.issubset(phase1_years):
              raise SystemExit(f"Missing modern phase-1 years: {sorted(modern_years - phase1_years)}")
          if not modern_years.issubset(phase2_essay_years):
              raise SystemExit(f"Missing modern phase-2 essay years: {sorted(modern_years - phase2_essay_years)}")

          for frame in (mc_images, essay_images):
              if frame["image_id"].duplicated().any():
                  raise SystemExit("image_id is not unique")
              if any(not Path(path).is_file() for path in frame["image_path"]):
                  raise SystemExit("At least one image_path is missing")

          if mc["source_pdf"].str.contains("redacao", case=False, na=False).any():
              raise SystemExit("Writing-prompt PDF leaked into multiple-choice dataset")
          if essay["source_pdf"].str.contains("redacao", case=False, na=False).any():
              raise SystemExit("Writing-prompt PDF leaked into essay dataset")

          for path in (Path("data/ita_multiple_choice.xlsx"), Path("data/ita_essay_questions.xlsx")):
              if not path.is_file() or not zipfile.is_zipfile(path):
                  raise SystemExit(f"Invalid XLSX: {path}")

          print(f"Multiple choice: {mc_questions} questions / {len(mc)} alternatives")
          print(f"Essay: {len(essay)} questions")
          print(f"Images: {len(mc_images)} MC / {len(essay_images)} essay")
          print(
              "Needs review: "
              f"{mc.loc[mc['needs_review'], 'question_id'].nunique()} MC / "
              f"{int(essay['needs_review'].sum())} essay"
          )
          PY

      - name: Commit generated datasets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git add -A data
          if git diff --cached --quiet; then
            echo "ITA datasets are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update ITA datasets"
          git push
