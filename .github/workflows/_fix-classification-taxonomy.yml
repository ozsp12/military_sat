name: Normalize remaining chemistry subtopics

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/_fix-classification-taxonomy.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/classify-ita-multiple-choice
      - name: Normalize subtopics
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv

          qids = {
            'ITA-MC-2012-SP-QUI-Q013',
            'ITA-MC-2014-SP-QUI-Q004',
            'ITA-MC-2015-SP-QUI-Q007',
            'ITA-MC-2015-SP-QUI-Q019',
            'ITA-MC-2017-SP-QUI-Q011',
            'ITA-MC-2017-SP-QUI-Q015',
            'ITA-MC-2018-SP-QUI-Q006',
            'ITA-MC-2018-SP-QUI-Q013',
            'ITA-MC-2021-P1-QUI-Q063',
            'ITA-MC-2022-P1-QUI-Q067',
          }
          seen=set()
          for path in sorted(Path('data/_classification_mapping').glob('*.tsv')):
            with path.open(encoding='utf-8', newline='') as f:
              rows=list(csv.DictReader(f, delimiter='\t'))
              fields=list(rows[0].keys()) if rows else []
            changed=False
            for row in rows:
              if row['question_id'] in qids:
                row['topic']='termoquimica'
                row['subtopic']='geral'
                seen.add(row['question_id'])
                changed=True
            if changed:
              with path.open('w', encoding='utf-8', newline='') as f:
                w=csv.DictWriter(f, fieldnames=fields, delimiter='\t', lineterminator='\n')
                w.writeheader(); w.writerows(rows)
          missing=qids-seen
          if missing: raise SystemExit(f'Missing: {sorted(missing)}')
          print(f'normalized {len(seen)} rows')
          PY
      - name: Commit corrections
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/_classification_mapping/
          git diff --cached --quiet && exit 0
          git commit -m "Normalize remaining chemistry subtopics"
          git push origin HEAD:agent/classify-ita-multiple-choice
