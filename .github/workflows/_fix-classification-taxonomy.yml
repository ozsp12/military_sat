name: Finalize classified ITA workbook

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/_fix-classification-taxonomy.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/classify-ita-multiple-choice
      - name: Verify workbook and summarize classifications
        run: |
          set -euo pipefail
          test -f data/ita_multiple_choice_classified.xlsx
          test "$(git hash-object data/ita_multiple_choice.xlsx)" = "d62f35d8a50cf6a6ed57a8b07fe60c7dec3a3494"
          python - <<'PY'
          from pathlib import Path
          import csv, statistics, zipfile

          rows=[]
          for p in sorted(Path('data/_classification_mapping').glob('*.tsv')):
              with p.open(encoding='utf-8', newline='') as f:
                  rows.extend(csv.DictReader(f, delimiter='\t'))
          ids=[r['question_id'] for r in rows]
          conf=[float(r['classification_confidence']) for r in rows]
          review=sum(str(r['needs_topic_review']).strip().lower()=='true' for r in rows)
          assert len(rows)==1616, len(rows)
          assert len(set(ids))==1616, len(set(ids))
          assert zipfile.is_zipfile('data/ita_multiple_choice_classified.xlsx')
          print(f'classified_questions={len(rows)}')
          print('alternative_rows=8080')
          print(f'needs_topic_review={review}')
          print(f'mean_confidence={statistics.fmean(conf):.4f}')
          print(f'workbook_bytes={Path("data/ita_multiple_choice_classified.xlsx").stat().st_size}')
          PY
      - name: Remove temporary classification files
        run: |
          git rm -r --ignore-unmatch \
            .github/workflows/_export-classification-source.yml \
            .github/workflows/_fix-classification-taxonomy.yml \
            data/_classification_source.tsv \
            data/_classification_source \
            data/_classification_compact \
            data/_classification_mapping \
            data/_classification_errors.txt \
            data/_classification_rerun.txt
      - name: Commit clean final artifact
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/ita_multiple_choice_classified.xlsx
          git commit -m "Finalize classified ITA workbook"
          git push origin HEAD:agent/classify-ita-multiple-choice
