name: Export compact ITA classification source

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - data/_classification_compact/**
      - data/_classification_mapping/**
      - data/ita_multiple_choice_classified.xlsx
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/classify-ita-multiple-choice
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas pyarrow
      - name: Build compact classification views
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          df = pd.read_parquet('data/ita_multiple_choice.parquet')
          base = df[['question_id','year','exam_phase','subject','question_number','question_text','needs_review','has_image']].drop_duplicates('question_id').copy()
          alts = (df.sort_values(['question_id','alternative'])
                    .groupby('question_id')
                    .apply(lambda g: ' || '.join(f"{a}:{t}" for a, t in zip(g['alternative'], g['alternative_text'])), include_groups=False)
                    .rename('alternatives'))
          q = base.merge(alts, on='question_id', how='left')

          def compact_text(text):
              text = ' '.join(str(text).split())
              if len(text) <= 240:
                  return text
              return text[:160] + ' [...] ' + text[-72:]

          def compact_alt(text):
              text = ' '.join(str(text).split())
              return text[:96]

          q['context'] = q['question_text'].map(compact_text) + ' | ALT ' + q['alternatives'].map(compact_alt)
          q = q[['question_id','year','exam_phase','subject','question_number','needs_review','has_image','context']]
          q = q.sort_values(['year','exam_phase','subject','question_number'])
          out = Path('data/_classification_compact')
          out.mkdir(parents=True, exist_ok=True)
          for year, part in q.groupby('year', sort=True):
              part.to_csv(out / f'{int(year)}.tsv', sep='\t', index=False, lineterminator='\n')
          print(f'exported {len(q)} compact rows')
          PY
      - name: Commit compact source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/_classification_compact/
          git diff --cached --quiet && exit 0
          git commit -m "Export compact ITA classification source"
          git push origin HEAD:agent/classify-ita-multiple-choice
