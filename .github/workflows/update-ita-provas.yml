name: Update ITA exam archive

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 1 * *"
  push:
    branches:
      - main
    paths:
      - "scripts/download_ita_provas.py"
      - "requirements.txt"
      - ".github/workflows/update-ita-provas.yml"

permissions:
  contents: write

concurrency:
  group: update-ita-exam-archive
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate downloader
        run: python -m compileall -q scripts/download_ita_provas.py

      - name: Download official ITA exams and first-phase answer keys
        run: python scripts/download_ita_provas.py --output ita_provas --refresh --min-files 114

      - name: Validate archive
        shell: bash
        run: |
          set -euo pipefail
          count="$(find ita_provas -type f -name '*.pdf' | wc -l)"
          echo "PDF count: ${count}"
          test "${count}" -ge 114

          gabaritos="$(find ita_provas -type f -iname 'gabarito*.pdf' ! -iname '*_2f*' | wc -l)"
          echo "First-phase/single-phase answer keys: ${gabaritos}"
          test "${gabaritos}" -ge 19
          test -z "$(find ita_provas -type f -iname 'gabarito*_2f*.pdf' -print -quit)"

          test -s ita_provas/manifest.xlsx
          test ! -e ita_provas/manifest.csv
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from zipfile import ZipFile

          path = Path("ita_provas/manifest.xlsx")
          required = {
              "[Content_Types].xml",
              "_rels/.rels",
              "xl/workbook.xml",
              "xl/_rels/workbook.xml.rels",
              "xl/styles.xml",
              "xl/worksheets/sheet1.xml",
              "xl/worksheets/_rels/sheet1.xml.rels",
              "xl/tables/table1.xml",
          }

          with ZipFile(path) as archive:
              bad_member = archive.testzip()
              if bad_member:
                  raise SystemExit(f"Corrupt XLSX member: {bad_member}")

              names = set(archive.namelist())
              missing = required.difference(names)
              if missing:
                  raise SystemExit(f"Invalid Excel manifest; missing: {sorted(missing)}")

              for name in names:
                  if name.endswith((".xml", ".rels")):
                      ET.fromstring(archive.read(name))

              ns = {
                  "m": "http://schemas.openxmlformats.org/spreadsheetml/2006/main",
              }
              table = ET.fromstring(archive.read("xl/tables/table1.xml"))
              sheet = ET.fromstring(archive.read("xl/worksheets/sheet1.xml"))

              if table.find("m:autoFilter", ns) is None:
                  raise SystemExit("Manifest table has no AutoFilter")
              if table.find("m:tableColumns", ns) is None:
                  raise SystemExit("Manifest table has no tableColumns")
              if sheet.find("m:tableParts", ns) is None:
                  raise SystemExit("Worksheet is not linked to the manifest table")
              if sheet.find("m:autoFilter", ns) is not None:
                  raise SystemExit(
                      "Worksheet contains a duplicate top-level AutoFilter; "
                      "the filter must belong to the Excel table only"
                  )
          PY
          git diff --check

      - name: Commit archive updates
        shell: bash
        run: |
          set -euo pipefail
          git add ita_provas
          if git diff --cached --quiet; then
            echo "ITA archive is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update ITA exam archive"
          git push
